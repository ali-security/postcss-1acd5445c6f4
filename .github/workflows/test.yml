name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'uvu test file regex; empty runs the full suite'
        required: false
        default: ''
permissions:
  contents: read
env:
  NODE_DISABLE_COLORS: 1
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Configure npm time machine registry
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2026-07-13T10:42:25.757000Z
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Node.js & pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: 11.10.0
          runtime: node@26
      - name: Install dependencies
        run: pnpm ci
      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            pnpm exec uvu -r ts-node/register/transpile-only test "${{ inputs.test-filter }}"
          else
            pnpm test
          fi
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        node:
          - 24
          - 22
    name: Node.js ${{ matrix.node }} Quick
    steps:
      - name: Configure npm time machine registry
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2026-07-13T10:42:25.757000Z
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Node.js & pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: 11.10.0
          runtime: node@${{ matrix.node }}
      - name: Install dependencies
        run: pnpm ci
      - name: Install dependencies
        run: pnpm ci --ignore-scripts
      - name: Run unit tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            pnpm exec uvu -r ts-node/register/transpile-only test "${{ inputs.test-filter }}"
          else
            pnpm run unit
          fi
  old:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        node:
          - 20
          - 18
          - 16
          - 14
          - 12
          - 10
    name: Node.js ${{ matrix.node }} Quick
    steps:
      - name: Configure npm time machine registry
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2026-07-13T10:42:25.757000Z
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 3
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Downgrade TypeScript
        run: pnpm install typescript@4 --ignore-scripts
      - name: Run unit tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            node --require ./test/old-node.js ./node_modules/uvu/bin.js -r module test "${{ inputs.test-filter }}"
          else
            pnpm run old
          fi
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    name: Windows Quick
    steps:
      - name: Configure npm time machine registry
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2026-07-13T10:42:25.757000Z
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0
      - name: Install Node.js LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        run: |
          if ("${{ inputs.test-filter }}") {
            pnpm exec uvu -r ts-node/register/transpile-only test "${{ inputs.test-filter }}"
          } else {
            pnpm run unit
          }
